<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Developer Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">DevPortfolio</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Contact Me</h2>
        <form id="contactForm" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn">Send Message</button>
            <p id="errorMsg" style="color: red; margin-top: 10px;"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio. <a href="https://github.com/kidx779" target="_blank" style="color: #00bcd4;">GitHub Profile</a></p>
    </footer>

    <script>
    function validateForm() {
        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let errorMsg = document.getElementById("errorMsg");

        if (name === "" || email === "") {
            errorMsg.innerText = "All fields must be filled out.";
            return false;
        }
        alert("Form submitted successfully!");
        return true;
    }
    </script>
</body>
</html>
